[build]
  command = "npm test && npm run build"
  publish = "dist"
  # Documentation-only pushes do not consume another production deployment.
  ignore = "node scripts/ignore-build.mjs"

[build.environment]
  NODE_VERSION = "24"

# Vite assets have content hashes: browser caching reduces repeat bandwidth.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep aliases consolidated at the public URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/guide/index.html"
  to = "/guide/"
  status = 301
  force = true
